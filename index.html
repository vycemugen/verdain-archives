<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdain: Dragon's Academy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Volcanic Ash Layer -->
    <div class="ash-overlay"></div>

    <header class="nav-bar">
        <!-- The rest of your navbar code remains completely unchanged below this -->

    <header class="nav-bar">
        <div class="logo">VERDAIN ARCHIVES</div>
        <nav class="nav-links">
            <a href="index.html" class="active">HOME</a>
            <a href="characters.html">ACADEMY PROSPECTS</a>
            <a href="lore.html">ACADEMY LORE</a>
        </nav>
    </header>

    <main class="hero-container">
        <h1 class="story-title magma-glow">VERDAIN</h1>
        <p class="story-subtitle">"Enter at twenty. Graduate, or die."<br><br>Cut into the heart of a jagged, storm-swept volcano lies a brutal military academy built of ancient black basalt and powered by raw spiritual energy.</p>
        <a href="characters.html" class="enter-btn">ACCESS PROSPECT DATABASE</a>
    </main>

    <!-- Hidden Audio Loop Engine -->
    <audio id="bg-music" src="assets/music/webtheme.mp3" loop></audio>

    <!-- Floating Interface Button -->
    <button class="audio-toggle" id="audio-btn">🔊 SOUND: OFF</button>

    <!-- Audio Controller Logic -->
    <script>
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('audio-btn');

        // Check if the music was already running on a previous page shift
        if (localStorage.getItem('musicPlaying') === 'true') {
            music.play().then(() => {
                btn.innerText = "🔊 SOUND: ON";
            }).catch(() => {
                // If browser blocks autostart, reset memory state
                localStorage.setItem('musicPlaying', 'false');
            });
        }

        // Toggle sound playback state on mouse click
        btn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                btn.innerText = "🔊 SOUND: ON";
                localStorage.setItem('musicPlaying', 'true');
            } else {
                music.pause();
                btn.innerText = "🔊 SOUND: OFF";
                localStorage.setItem('musicPlaying', 'false');
            }
        });
    </script>
</body>
</html>
